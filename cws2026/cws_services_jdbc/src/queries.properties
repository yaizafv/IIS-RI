# TPAYMENTMEANS
TPAYMENTMEANS_ADD = INSERT INTO TPaymentMeans \
    (id, dtype, createdAt, updatedAt, version, entityState, accumulated, client_id) \
    VALUES (?, ?, ?, ?, ?, ?, ?, ?)
TPAYMENTMEANS_ADD_ACCUMULATED = UPDATE TPaymentMeans \
    SET accumulated = accumulated + ?, version = version + 1 WHERE id = ?
TPAYMENTMEANS_DELETE = DELETE FROM TPaymentMeans WHERE id = ?
TPAYMENTMEANS_DELETE_FOR_CLIENT = DELETE FROM TPaymentMeans WHERE client_id = ?
TPAYMENTMEANS_FIND_FULL = SELECT pm.id, pm.version, pm.createdAt, pm.updatedAt, \
    pm.entityState, pm.client_id, pm.accumulated, pm.dtype, \
    cc.number AS card_number, cc.validThru AS card_valid_thru, cc.type AS card_type, \
    v.code AS voucher_code, v.description AS voucher_description, \
    v.available AS voucher_available FROM TPaymentMeans pm \
    LEFT JOIN TCreditCards cc ON cc.id = pm.id LEFT JOIN TVouchers v ON v.id = pm.id
TPAYMENTMEANS_FIND_FULL_BY_CLIENT_ID = SELECT pm.id, pm.version, pm.createdAt, \
    pm.updatedAt, pm.entityState, pm.client_id, pm.accumulated, pm.dtype, \
    cc.number AS card_number, cc.validThru AS card_valid_thru, cc.type AS card_type, \
    v.code AS voucher_code, v.description AS voucher_description, \
    v.available AS voucher_available FROM TPaymentMeans pm \
    LEFT JOIN TCreditCards cc ON cc.id = pm.id LEFT JOIN TVouchers v ON v.id = pm.id \
    WHERE pm.client_id = ? ORDER BY pm.id
TPAYMENTMEANS_FIND_FULL_BY_ID = SELECT pm.id, pm.version, pm.createdAt, \
    pm.updatedAt, pm.entityState, pm.client_id, pm.accumulated, pm.dtype, \
    cc.number AS card_number, cc.validThru AS card_valid_thru, cc.type AS card_type, \
    v.code AS voucher_code, v.description AS voucher_description, \
    v.available AS voucher_available FROM TPaymentMeans pm \
    LEFT JOIN TCreditCards cc ON cc.id = pm.id LEFT JOIN TVouchers v ON v.id = pm.id \
    WHERE pm.id = ?
TPAYMENTMEANS_UPDATE = UPDATE TPaymentMeans SET accumulated = ?, updatedAt = ?, \
    version = version + 1 WHERE id = ? AND version = ?

