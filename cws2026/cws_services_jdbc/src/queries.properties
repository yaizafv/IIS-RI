# TINVOICES
TINVOICES_ADD = INSERT INTO TInvoices \
    (id, version, number, date, state, usedForVoucher, subtotal, total, vatAmount, vatRate, \
    createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TINVOICES_FIND_ALL = SELECT id, version, entityState, createdAt, updatedAt, number, date, state, subtotal, \
 	total, vatAmount, vatRate FROM TInvoices
TINVOICES_FIND_BY_ID = SELECT id, version, entityState, createdAt, updatedAt, number, date, state, subtotal, \
	total, vatAmount, vatRate FROM TInvoices WHERE id = ?
TINVOICES_FIND_BY_NUMBER = SELECT id, version, entityState, createdAt, updatedAt, number, date, state, \
	subtotal, total, vatAmount, vatRate FROM TInvoices WHERE number = ?
TINVOICES_FIND_LAST_NUMBER = SELECT MAX(number) FROM TInvoices
TINVOICES_MARK_USED_FOR_VOUCHER = UPDATE TInvoices SET usedForVoucher = TRUE WHERE id = ?
TINVOICES_REMOVE = DELETE FROM TInvoices WHERE id = ?
TINVOICES_SET_PAID = UPDATE TInvoices SET state = 'PAID', \
    version = version + 1, updatedAt = ? WHERE id = ? AND state <> 'PAID'
TINVOICES_UPDATE = UPDATE TInvoices SET number = ?, date = ?, state = ?, subtotal = ?, total = ?, \
	vatAmount = ?, vatRate = ?, version = version + 1, updatedAt = ? WHERE id = ? AND version = ?

