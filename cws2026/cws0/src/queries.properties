# TInvoices
TINVOICES_FIND_LAST_NUMBER = SELECT MAX(number) FROM TInvoices
TINVOICES_INSERT_FOR_INVOICE = INSERT INTO TInvoices \
    (id, version, number, date, state, usedForVoucher, subtotal, total, vatAmount, vatRate, \
    createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)

# TMechanics
TMECHANICS_ADD = INSERT INTO TMechanics \
    (id, nif, name, surname, version, createdAt, updatedAt, entityState) \
    VALUES (?, ?, ?, ?, ?, ?, ?, ?)
TMECHANICS_DELETE = DELETE FROM TMechanics WHERE id = ?
TMECHANICS_FIND_ALL = SELECT id, nif, name, surname, version, createdAt, \
    updatedAt, entityState FROM TMechanics
TMECHANICS_FIND_BY_ID = SELECT id, nif, name, surname, version, createdAt, \
    updatedAt, entityState FROM TMechanics WHERE id = ?
TMECHANICS_FIND_BY_NIF = SELECT id, nif, name, surname, version, createdAt, \
    updatedAt, entityState FROM TMechanics WHERE nif = ?
TMECHANICS_UPDATE = UPDATE TMechanics SET name = ?, surname = ?, nif = ?, \
    version = version + 1, updatedAt = ? WHERE id = ? AND version = ?

# TWorkOrders
TWORKORDERS_SELECT_ALL_COLUMNS = SELECT id, version, entityState, createdAt, \
    updatedAt, vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders
TWORKORDERS_ADD = INSERT INTO TWorkOrders \
    (id, vehicle_id, mechanic_id, invoice_id, description, date, state, total_amount, \
    version, createdAt, updatedAt, entityState) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TWORKORDERS_DELETE = DELETE FROM TWorkOrders WHERE id = ?
TWORKORDERS_UPDATE = UPDATE TWorkOrders SET vehicle_id = ?, mechanic_id = ?, \
    invoice_id = ?, description = ?, date = ?, state = ?, total_amount = ?, \
    version = version + 1, updatedAt = ? WHERE id = ? AND version = ?
TWORKORDERS_FIND_BY_ID = SELECT id, version, entityState, createdAt, updatedAt, \
    vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders WHERE id = ?
TWORKORDERS_FIND_ALL = SELECT id, version, entityState, createdAt, updatedAt, \
    vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders
TWORKORDERS_FIND_BY_MECHANIC_ID = SELECT id, version, entityState, createdAt, \
    updatedAt, vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders WHERE mechanic_id = ?
TWORKORDERS_FIND_BY_VEHICLE_ID = SELECT id, version, entityState, createdAt, \
    updatedAt, vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders WHERE vehicle_id = ?
TWORKORDERS_FIND_BY_STATE = SELECT id, version, entityState, createdAt, updatedAt, \
    vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders WHERE state = ?
TWORKORDERS_FIND_NOT_INVOICED_BY_CLIENT_NIF = SELECT w.id, w.version, w.entityState, \
    w.createdAt, w.updatedAt, w.vehicle_id, w.description, w.date, w.total_amount, \
    w.state, w.mechanic_id, w.invoice_id FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE w.state = 'APPROVED' AND c.nif = ?
TINTERVENTIONS_FIND_BY_MECHANIC_ID = SELECT id, version, entityState, createdAt, \
    updatedAt, mechanic_id, workorder_id, date, minutes \
    FROM TInterventions WHERE mechanic_id = ?
TINTERVENTIONS_ADD = INSERT INTO TInterventions \
    (id, version, createdAt, updatedAt, entityState, mechanic_id, workorder_id, date, minutes) \
    VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)
TINTERVENTIONS_DELETE = DELETE FROM TInterventions WHERE id = ?
TINTERVENTIONS_UPDATE = UPDATE TInterventions SET mechanic_id = ?, workorder_id = ?, \
    date = ?, minutes = ?, version = version + 1, updatedAt = ? WHERE id = ? AND version = ?
TINTERVENTIONS_FIND_BY_ID = SELECT id, version, entityState, createdAt, updatedAt, \
    mechanic_id, workorder_id, date, minutes FROM TInterventions WHERE id = ?
TINTERVENTIONS_FIND_ALL = SELECT id, version, entityState, createdAt, updatedAt, \
    mechanic_id, workorder_id, date, minutes FROM TInterventions
TWORKORDERS_FIND_BY_CLIENT_NIF = SELECT w.id, w.date, w.description, w.state, \
    w.total_amount FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE c.nif = ?
TWORKORDERS_FIND_FOR_INVOICE = SELECT id, total_amount, state \
    FROM TWorkOrders WHERE id = ?
TWORKORDERS_FIND_NOT_INVOICED = SELECT w.id, w.description, w.date, w.state, \
    w.total_amount FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE w.state = 'APPROVED' AND c.nif = ?
TWORKORDERS_UPDATE_FOR_INVOICE = UPDATE TWorkOrders \
    SET invoice_id = ?, state = 'INVOICED', version = version + 1, updatedAt = ? \
    WHERE id = ?

# TClients
TCLIENTS_ADD = INSERT INTO TClients \
    (id, version, createdAt, updatedAt, entityState, name, surname, nif, phone, email, \
    street, city, country, postalCode) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TCLIENTS_DELETE_BY_ID = DELETE FROM TClients WHERE id = ?
TCLIENTS_EXISTS_BY_ID = SELECT id FROM TClients WHERE id = ?
TCLIENTS_FIND_BY_NIF = SELECT id, version, nif, name, surname, street, city, country, \
    postalCode, phone, email FROM TClients WHERE nif = ?
TCLIENTS_FIND_OTHER_BY_NIF = SELECT id FROM TClients WHERE nif = ? AND id <> ?
TCLIENTS_FIND_ALL = SELECT id, version, nif, name, surname, street, city, country, \
    postalCode, phone, email FROM TClients
TCLIENTS_FIND_RECOMMENDED_BY_NIF = SELECT c.id, c.version, c.nif, c.name, c.surname, \
    c.street, c.city, c.country, c.postalCode, c.phone, c.email FROM TClients c \
    JOIN TRecommendations r ON r.recommended_id = c.id \
    JOIN TClients recommender ON recommender.id = r.recommender_id \
    WHERE recommender.nif = ? ORDER BY c.id
TCLIENTS_UPDATE = UPDATE TClients SET name = ?, surname = ?, nif = ?, phone = ?, email = ?, \
    street = ?, city = ?, country = ?, postalCode = ?, version = version + 1, updatedAt = ? \
    WHERE id = ? AND version = ?
TCLIENTS_HAS_PAID_INVOICES = SELECT pm.id FROM TPaymentMeans pm \
    JOIN TCharges ch ON ch.paymentMean_id = pm.id \
    JOIN TInvoices i ON i.id = ch.invoice_id \
    WHERE pm.client_id = ? AND i.state = 'PAID'
TVEHICLES_EXISTS_BY_CLIENT = SELECT id FROM TVehicles WHERE client_id = ?
TRECOMMENDATIONS_ADD = INSERT INTO TRecommendations \
    (id, createdAt, updatedAt, entityState, usedForVoucher, version, recommender_id, recommended_id) \
    VALUES (?, ?, ?, ?, ?, ?, ?, ?)
TRECOMMENDATIONS_DELETE_FOR_CLIENT = DELETE FROM TRecommendations \
    WHERE recommender_id = ? OR recommended_id = ?
TPAYMENTMEANS_ADD_CASH = INSERT INTO TPaymentMeans \
    (id, dtype, createdAt, updatedAt, version, entityState, accumulated, client_id) \
    VALUES (?, 'Cash', ?, ?, ?, ?, 0, ?)
TCASHES_ADD = INSERT INTO TCashes (id) VALUES (?)
TCHARGES_DELETE_FOR_CLIENT = DELETE FROM TCharges WHERE paymentMean_id IN \
    (SELECT id FROM TPaymentMeans WHERE client_id = ?)
TCASHES_DELETE_FOR_CLIENT = DELETE FROM TCashes WHERE id IN \
    (SELECT id FROM TPaymentMeans WHERE client_id = ?)
TCREDITCARDS_DELETE_FOR_CLIENT = DELETE FROM TCreditCards WHERE id IN \
    (SELECT id FROM TPaymentMeans WHERE client_id = ?)
TVOUCHERS_DELETE_FOR_CLIENT = DELETE FROM TVouchers WHERE id IN \
    (SELECT id FROM TPaymentMeans WHERE client_id = ?)
TPAYMENTMEANS_DELETE_FOR_CLIENT = DELETE FROM TPaymentMeans WHERE client_id = ?
TPAYMENTMEANS_ADD = INSERT INTO TPaymentMeans \
    (id, dtype, createdAt, updatedAt, version, entityState, accumulated, client_id) \
    VALUES (?, ?, ?, ?, ?, ?, ?, ?)
TPAYMENTMEANS_ADD_GENERATED = INSERT INTO TPaymentMeans \
    (id, dtype, createdAt, updatedAt, version, entityState, accumulated, client_id) \
    VALUES (?, 'Voucher', ?, ?, ?, ?, ?, ?)
TPAYMENTMEANS_DELETE = DELETE FROM TPaymentMeans WHERE id = ?
TCREDITCARDS_ADD = INSERT INTO TCreditCards (id, type, validThru, number) VALUES (?, ?, ?, ?)
TVOUCHERS_ADD = INSERT INTO TVouchers (id, description, available, code) VALUES (?, ?, ?, ?)
TVOUCHERS_FIND_BY_CLIENT_NIF = SELECT pm.id, pm.version, pm.client_id, pm.accumulated, \
    v.code, v.description, v.available FROM TPaymentMeans pm \
    JOIN TVouchers v ON v.id = pm.id \
    JOIN TClients c ON c.id = pm.client_id WHERE c.nif = ? ORDER BY v.code
TVOUCHERS_SUMMARY = SELECT c.nif, c.name, c.surname, COUNT(v.id) AS issuedQty, \
    SUM(pm.accumulated + v.available) AS totalAmount, SUM(v.available) AS availableAmount, \
    SUM(pm.accumulated) AS consumedAmount FROM TPaymentMeans pm \
    JOIN TVouchers v ON v.id = pm.id JOIN TClients c ON c.id = pm.client_id \
    GROUP BY c.id, c.nif, c.name, c.surname ORDER BY SUM(v.available) DESC, c.nif
TVOUCHERS_WORKORDERS_ELIGIBLE = SELECT c.id AS client_id, w.id AS workorder_id \
    FROM TWorkOrders w JOIN TVehicles v ON v.id = w.vehicle_id \
    JOIN TClients c ON c.id = v.client_id JOIN TInvoices i ON i.id = w.invoice_id \
    WHERE i.state = 'PAID' AND w.usedForVoucher = FALSE \
    ORDER BY c.id, w.id
TWORKORDERS_MARK_USED_FOR_VOUCHER = UPDATE TWorkOrders SET usedForVoucher = TRUE WHERE id = ?
TVOUCHERS_RECOMMENDATIONS_ELIGIBLE = SELECT r.id, r.recommender_id \
    FROM TRecommendations r WHERE r.usedForVoucher = FALSE \
    AND EXISTS (SELECT 1 FROM TPaymentMeans pm JOIN TCharges ch ON ch.paymentMean_id = pm.id \
        JOIN TInvoices i ON i.id = ch.invoice_id \
        WHERE pm.client_id = r.recommender_id AND i.state = 'PAID') \
    AND EXISTS (SELECT 1 FROM TPaymentMeans pm JOIN TCharges ch ON ch.paymentMean_id = pm.id \
        JOIN TInvoices i ON i.id = ch.invoice_id \
        WHERE pm.client_id = r.recommended_id AND i.state = 'PAID') \
    ORDER BY r.recommender_id, r.id
TRECOMMENDATIONS_MARK_USED_FOR_VOUCHER = UPDATE TRecommendations \
    SET usedForVoucher = TRUE WHERE id = ?
TVOUCHERS_INVOICES_ELIGIBLE = SELECT DISTINCT i.id, pm.client_id \
    FROM TInvoices i JOIN TCharges ch ON ch.invoice_id = i.id \
    JOIN TPaymentMeans pm ON pm.id = ch.paymentMean_id \
    WHERE i.state = 'PAID' AND i.usedForVoucher = FALSE AND i.total > 500 \
    ORDER BY i.id, pm.client_id
TINVOICES_MARK_USED_FOR_VOUCHER = UPDATE TInvoices SET usedForVoucher = TRUE WHERE id = ?
