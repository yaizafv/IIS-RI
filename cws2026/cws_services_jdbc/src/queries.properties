TMECHANICS_FIND_ALL = SELECT id, nif, name, surname, version, createdAt, \
    updatedAt, entityState FROM TMechanics
TMECHANICS_FIND_BY_ID = SELECT id, nif, name, surname, version, createdAt, \
    updatedAt, entityState FROM TMechanics WHERE id = ?
TMECHANICS_FIND_BY_NIF = SELECT id, nif, name, surname, version, createdAt, \
    updatedAt, entityState FROM TMechanics WHERE nif = ?
TMECHANICS_REMOVE = DELETE FROM TMechanics WHERE id = ?
TMECHANICS_UPDATE = UPDATE TMechanics SET name = ?, surname = ?, nif = ?, \
    version = version + 1, updatedAt = ? WHERE id = ? AND version = ?

# TPAYMENTMEANS
TPAYMENTMEANS_ADD = INSERT INTO TPaymentMeans \
