# TVOUCHERS
TVOUCHERS_ADD = INSERT INTO TVouchers (id, description, available, code) VALUES (?, ?, ?, ?)
TVOUCHERS_DECREASE_AVAILABLE = UPDATE TVouchers SET available = available - ? WHERE id = ?
TVOUCHERS_DELETE_FOR_CLIENT = DELETE FROM TVouchers WHERE id IN \
    (SELECT id FROM TPaymentMeans WHERE client_id = ?)
TVOUCHERS_DELETE = DELETE FROM TVouchers WHERE id = ?
TVOUCHERS_EXISTS_BY_CODE = SELECT id FROM TVouchers WHERE code = ?
TVOUCHERS_FIND_FULL = SELECT pm.id, pm.version, pm.createdAt, pm.updatedAt, \
    pm.entityState, pm.client_id, pm.accumulated, v.code, v.description, v.available \
    FROM TPaymentMeans pm JOIN TVouchers v ON v.id = pm.id
TVOUCHERS_FIND_FULL_BY_CODE = SELECT pm.id, pm.version, pm.createdAt, pm.updatedAt, \
    pm.entityState, pm.client_id, pm.accumulated, v.code, v.description, v.available \
    FROM TPaymentMeans pm JOIN TVouchers v ON v.id = pm.id WHERE v.code = ?
TVOUCHERS_FIND_FULL_BY_CLIENT_ID = SELECT pm.id, pm.version, pm.createdAt, pm.updatedAt, \
    pm.entityState, pm.client_id, pm.accumulated, v.code, v.description, v.available \
    FROM TPaymentMeans pm JOIN TVouchers v ON v.id = pm.id WHERE pm.client_id = ? ORDER BY v.code
TVOUCHERS_FIND_FULL_BY_ID = SELECT pm.id, pm.version, pm.createdAt, pm.updatedAt, \
    pm.entityState, pm.client_id, pm.accumulated, v.code, v.description, v.available \
    FROM TPaymentMeans pm JOIN TVouchers v ON v.id = pm.id WHERE pm.id = ?
TVOUCHERS_FIND_FULL_BY_CLIENT_NIF = SELECT pm.id, pm.version, pm.createdAt, \
    pm.updatedAt, pm.entityState, pm.client_id, pm.accumulated, v.code, \
    v.description, v.available FROM TPaymentMeans pm JOIN TVouchers v ON v.id = pm.id \
    JOIN TClients c ON c.id = pm.client_id WHERE c.nif = ? ORDER BY v.code
TVOUCHERS_UPDATE = UPDATE TVouchers SET description = ?, available = ?, code = ? \
    WHERE id = ?
TVOUCHERS_INVOICES_ELIGIBLE = SELECT DISTINCT pm.client_id, i.id \
    FROM TInvoices i JOIN TCharges ch ON ch.invoice_id = i.id \
    JOIN TPaymentMeans pm ON pm.id = ch.paymentMean_id \
    WHERE i.state = 'PAID' AND i.usedForVoucher = FALSE AND i.total > 500 \
    ORDER BY i.id, pm.client_id
TVOUCHERS_RECOMMENDATIONS_ELIGIBLE = SELECT r.recommender_id, r.id \
    FROM TRecommendations r WHERE r.usedForVoucher = FALSE \
    AND EXISTS (SELECT 1 FROM TPaymentMeans pm JOIN TCharges ch ON ch.paymentMean_id = pm.id \
        JOIN TInvoices i ON i.id = ch.invoice_id \
        WHERE pm.client_id = r.recommender_id AND i.state = 'PAID') \
    AND EXISTS (SELECT 1 FROM TPaymentMeans pm JOIN TCharges ch ON ch.paymentMean_id = pm.id \
        JOIN TInvoices i ON i.id = ch.invoice_id \
        WHERE pm.client_id = r.recommended_id AND i.state = 'PAID') \
    ORDER BY r.recommender_id, r.id
TVOUCHERS_SUMMARY = SELECT c.nif, c.name, c.surname, COUNT(v.id) AS issuedQty, \
    SUM(pm.accumulated + v.available) AS totalAmount, SUM(v.available) AS availableAmount, \
    SUM(pm.accumulated) AS consumedAmount FROM TPaymentMeans pm \
    JOIN TVouchers v ON v.id = pm.id JOIN TClients c ON c.id = pm.client_id \
    GROUP BY c.id, c.nif, c.name, c.surname ORDER BY SUM(v.available) DESC, c.nif
TVOUCHERS_WORKORDERS_ELIGIBLE = SELECT c.id AS client_id, w.id AS workorder_id \
    FROM TWorkOrders w JOIN TVehicles v ON v.id = w.vehicle_id \
    JOIN TClients c ON c.id = v.client_id JOIN TInvoices i ON i.id = w.invoice_id \
    WHERE i.state = 'PAID' AND w.usedForVoucher = FALSE \
    ORDER BY c.id, w.id

# TWORKORDERS
TWORKORDERS_FIND_ALL = SELECT id, version, entityState, createdAt, updatedAt, \
    vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders
TWORKORDERS_FIND_BY_CLIENT_NIF = SELECT w.id, w.version, w.entityState, \
    w.createdAt, w.updatedAt, w.vehicle_id, w.description, w.date, \
    w.total_amount, w.state, w.mechanic_id, w.invoice_id FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE c.nif = ?
TWORKORDERS_FIND_BY_ID = SELECT id, version, entityState, createdAt, updatedAt, \
    vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders WHERE id = ?
TWORKORDERS_FIND_BY_MECHANIC_ID = SELECT id, version, entityState, createdAt, \
    updatedAt, vehicle_id, description, date, total_amount, state, mechanic_id, invoice_id \
    FROM TWorkOrders WHERE mechanic_id = ?
TWORKORDERS_FIND_NOT_INVOICED_WORK_ORDERS_BY_CLIENT_NIF = SELECT w.id, w.version, w.entityState, \
    w.createdAt, w.updatedAt, w.vehicle_id, w.description, w.date, w.total_amount, \
    w.state, w.mechanic_id, w.invoice_id FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE w.invoice_id IS NULL AND c.nif = ?
TWORKORDERS_MARK_USED_FOR_VOUCHER = UPDATE TWorkOrders SET usedForVoucher = TRUE WHERE id = ?
TWORKORDERS_SET_INVOICED = UPDATE TWorkOrders SET invoice_id = ?, state = 'INVOICED', version = version + 1, \
	updatedAt = ? WHERE id = ?
