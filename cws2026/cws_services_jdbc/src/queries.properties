# TCLIENTS
TCLIENTS_ADD = INSERT INTO TClients \
    (id, version, createdAt, updatedAt, entityState, name, surname, nif, phone, email, \
    street, city, country, postalCode) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)
TCLIENTS_DELETE_BY_ID = DELETE FROM TClients WHERE id = ?
TCLIENTS_EXISTS_BY_ID = SELECT id FROM TClients WHERE id = ?
TCLIENTS_FIND_BY_ID = SELECT id, version, createdAt, updatedAt, entityState, nif, \
    name, surname, street, city, country, postalCode, phone, email FROM TClients WHERE id = ?
TCLIENTS_FIND_ALL = SELECT id, version, createdAt, updatedAt, entityState, nif, \
    name, surname, street, city, country, postalCode, phone, email FROM TClients
TCLIENTS_FIND_BY_NIF = SELECT id, version, createdAt, updatedAt, entityState, nif, \
    name, surname, street, city, country, postalCode, phone, email FROM TClients WHERE nif = ?
TCLIENTS_FIND_OTHER_BY_NIF = SELECT id FROM TClients WHERE nif = ? AND id <> ?
TCLIENTS_FIND_RECOMMENDED_BY_NIF = SELECT c.id, c.version, c.createdAt, c.updatedAt, \
    c.entityState, c.nif, c.name, c.surname, c.street, c.city, c.country, \
    c.postalCode, c.phone, c.email FROM TClients c \
    JOIN TRecommendations r ON r.recommended_id = c.id \
    JOIN TClients recommender ON recommender.id = r.recommender_id \
    WHERE recommender.nif = ? ORDER BY c.id
TCLIENTS_HAS_PAID_INVOICES = SELECT pm.id FROM TPaymentMeans pm \
    JOIN TCharges ch ON ch.paymentMean_id = pm.id \
    JOIN TInvoices i ON i.id = ch.invoice_id \
    WHERE pm.client_id = ? AND i.state = 'PAID'
TCLIENTS_UPDATE = UPDATE TClients SET name = ?, surname = ?, nif = ?, phone = ?, email = ?, \
    street = ?, city = ?, country = ?, postalCode = ?, version = version + 1, updatedAt = ? \
    WHERE id = ? AND version = ?

