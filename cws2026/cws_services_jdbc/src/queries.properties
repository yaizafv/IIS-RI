# TRECOMMENDATIONS
TRECOMMENDATIONS_ADD = INSERT INTO TRecommendations \
    (id, createdAt, updatedAt, entityState, usedForVoucher, version, recommender_id, recommended_id) \
    VALUES (?, ?, ?, ?, ?, ?, ?, ?)
TRECOMMENDATIONS_DELETE = DELETE FROM TRecommendations WHERE id = ?
TRECOMMENDATIONS_FIND_BY_CLIENT_ID = SELECT id, version, createdAt, updatedAt, entityState, \
    usedForVoucher, recommender_id, recommended_id FROM TRecommendations \
    WHERE recommender_id = ? OR recommended_id = ?

# TVEHICLES
TVEHICLES_FIND_BY_CLIENT_ID = SELECT id, version, createdAt, updatedAt, entityState, \
    client_id, licensePlate, make, model FROM TVehicles WHERE client_id = ?
TVEHICLES_FIND_BY_ID = SELECT id, version, createdAt, updatedAt, entityState, \
    client_id, licensePlate, make, model FROM TVehicles WHERE id = ?

# TVOUCHERS
TVOUCHERS_ADD = INSERT INTO TVouchers (id, description, available, code) VALUES (?, ?, ?, ?)
TVOUCHERS_DELETE = DELETE FROM TVouchers WHERE id = ?
TVOUCHERS_FIND_BY_CLIENT_ID = SELECT pm.id, pm.version, pm.createdAt, pm.updatedAt, \
    pm.entityState, pm.client_id, pm.accumulated, pm.dtype, v.code, v.description, v.available \
    FROM TVouchers v JOIN TPaymentMeans pm ON pm.id = v.id WHERE pm.client_id = ? ORDER BY v.code

# TWORKORDERS
TWORKORDERS_FIND_BY_CLIENT_NIF = SELECT w.id, w.version, w.entityState, \
    w.createdAt, w.updatedAt, w.vehicle_id, w.description, w.date, \
    w.total_amount, w.state, w.usedForVoucher, w.mechanic_id, w.invoice_id FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE c.nif = ?
TWORKORDERS_FIND_BY_ID = SELECT id, version, entityState, createdAt, updatedAt, \
    vehicle_id, description, date, total_amount, state, usedForVoucher, mechanic_id, invoice_id \
    FROM TWorkOrders WHERE id = ?
TWORKORDERS_FIND_BY_MECHANIC_ID = SELECT id, version, entityState, createdAt, \
    updatedAt, vehicle_id, description, date, total_amount, state, usedForVoucher, \
    mechanic_id, invoice_id FROM TWorkOrders WHERE mechanic_id = ?
TWORKORDERS_FIND_NOT_INVOICED_WORK_ORDERS_BY_CLIENT_NIF = SELECT w.id, w.version, w.entityState, \
    w.createdAt, w.updatedAt, w.vehicle_id, w.description, w.date, w.total_amount, \
    w.state, w.usedForVoucher, w.mechanic_id, w.invoice_id FROM TWorkOrders w \
    JOIN TVehicles v ON w.vehicle_id = v.id \
    JOIN TClients c ON v.client_id = c.id \
    WHERE w.invoice_id IS NULL AND c.nif = ?
TWORKORDERS_FIND_NOT_USED_FOR_VOUCHER_BY_INVOICE_STATE = SELECT w.id, w.version, w.entityState, \
    w.createdAt, w.updatedAt, w.vehicle_id, w.description, w.date, w.total_amount, \
    w.state, w.usedForVoucher, w.mechanic_id, w.invoice_id FROM TWorkOrders w \
    JOIN TInvoices i ON i.id = w.invoice_id \
    JOIN TVehicles v ON v.id = w.vehicle_id \
    WHERE i.state = ? AND w.usedForVoucher = FALSE ORDER BY v.client_id, w.date, w.id
TWORKORDERS_UPDATE = UPDATE TWorkOrders SET description = ?, total_amount = ?, state = ?, \
    usedForVoucher = ?, mechanic_id = ?, invoice_id = ?, version = version + 1, updatedAt = ? \
    WHERE id = ? AND version = ?
